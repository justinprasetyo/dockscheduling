<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dock Scheduler</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div>
        <h1>Dock Scheduler</h1>
        <p>by Justin P</p>
    </div>
    
    <div>
        <label for="dockname">Choose a dock:</label>
        <select id="dockname" name="docks" required>
            <option value="1">North Pier West - 410'</option>
            <option value="2">North Pier Face - 75'</option>
            <option value="3">North Pier East - 240'</option>
            <option value="4">Inner Channel - 55'</option>
            <option value="5">South Float West - 90'</option>
            <option value="6">South Float East - 90'</option>
        </select>
    </div>
    <br>
    <div>
        <label for="vessellength">Input vessel dimensions:</label>
        <input placeholder="length of vessel(ft)" id="vessellength" type="number" required>
        <input placeholder="width of vessel(ft)" id="vesselwidth" type="number" required>
    </div>
    <br>
    <div>
        <label for="startdate">Input booking duration:</label>
        <input placeholder="start date" id="startdate" type="date" required>
        <input placeholder="end date" id="enddate" type="date" required>
    </div>
    <br>
    <div>
        <label for="reason">Reason for booking:</label>
        <input id="reason" placeholder="reason">
        <button id="enter-btn-all">Enter</button>
        <button id="delete-btn-all">delete (for testing)</button>
    </div>

    <div>
        <p id="alert"></p>
    </div>

    <div class="reservation-confirmation" id="reservation-confirmation">
        <h4>confirm reservation?</h4>
        <button id="unconfirm-reservation">no</button>
        <button id="confirm-reservation">yes</button>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
