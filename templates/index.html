<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dock Scheduler</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <h1>Dock Scheduler</h1>
    <div>
        <input placeholder="length of vessel(ft)" id="vessellength" type="number">
        <input placeholder="width of vessel(ft)" id="vesselwidth" type="number">
        <button id="enter-btn-vessellengthwidth">Enter</button>
    </div>

    <div>
        <input placeholder="start date" id="startdate" type="date">
        <input placeholder="end date" id="enddate" type="date">
        <button id="enter-btn-date">Enter</button>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
