<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dock Scheduler</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div>
        <h1>Dock Scheduler</h1>
    </div>
    
    <div>
        <label for="dockname">Choose a dock:</label>
        <select id="dockname" name="docks">
            <option value="1">North Pier West - 410'</option>
            <option value="2">North Pier Face - 75'</option>
            <option value="3">North Pier East - 240'</option>
            <option value="4">Inner Channel - 55'</option>
            <option value="5">South Float West - 90'</option>
            <option value="6">South Float East - 90'</option>
        </select>
    </div>
    <br>
    <div>
        <label for="vessellength">Input vessel dimensions:</label>
        <input placeholder="length of vessel(ft)" id="vessellength" type="number">
        <input placeholder="width of vessel(ft)" id="vesselwidth" type="number">
    </div>
    <br>
    <div>
        <label for="startdate">Input booking duration:</label>
        <input placeholder="start date" id="startdate" type="date">
        <input placeholder="end date" id="enddate" type="date">
    </div>
    <br>
    <div>
        <label for="reason">Reason for booking:</label>
        <input id="reason" placeholder="input vessel/event name if applicable">
        <button id="enter-btn-all">Enter</button>
    </div>

    <div>
        <p id="alert"></p>
    </div>

    <div class="reservation-confirmation" id="reservation-confirmation">
        <h4>confirm reservation?</h4>
        <p id="reservation-confirmation-text"></p>
        <button id="unconfirm-reservation">no</button>
        <button id="confirm-reservation">yes</button>
    </div>

    <div class="reservation-confirmation-delete" id="reservation-confirmation-delete">
        <h4>are you sure you want to cancel this reservation?</h4>
        <p id="reservation-confirmation-delete-text"></p>
        <button id="unconfirm-reservation-delete">no</button>
        <button id="confirm-reservation-delete">yes</button>
    </div>

    <section class="reservations-list">
        <h2>Current Reservations (YYYY-MM-DD)</h2>
        <label for="filter-type">Filter by:</label>
        <select id="filter-type" name="docks">
            <option value="dock_number">Dock number (1 to 6)</option>
            <option value="start_date">Start date</option>
            <option value="end_date">End date</option>
            <option value="reason">Reason</option>
            <option value="id">ID</option>
        </select>
        <input id="filter-input" placeholder="filter by...">
        <button id="filter-btn">filter</button>

        <table>
            <thead>
                <tr>
                    <th>DOCK</th>
                    <th>START DATE</th>
                    <th>END DATE</th>
                    <th>REASON</th>
                    <th>ID</th>
                </tr>
            </thead>

            <tbody id="reservations-table">
                
            </tbody>
        </table>
    </section>

    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
